<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Préstamo de Equipos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .badge-pendiente { color: #d9534f; font-weight: bold; }
        .badge-devuelto { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistema de Préstamo de Equipos</h2>
    
    <!-- Campos base -->
    <div class="form-group">
        <label for="estudiante">Nombre del Estudiante:</label>
        <input type="text" id="estudiante" placeholder="Ej. Ana Pérez">
    </div>
    
    <div class="form-group">
        <label for="equipo">Equipo Solicitado:</label>
        <input type="text" id="equipo" placeholder="Ej. Laptop HP / Proyector">
    </div>

    <!-- CAMBIO RAMA 1: Fecha de Devolución -->
    <div class="form-group">
        <label for="fechaDevolucion">Fecha de Devolución:</label>
        <input type="date" id="fechaDevolucion">
    </div>

    <!-- CAMBIO RAMA 2: Estado del Préstamo -->
    <div class="form-group">
        <label for="estado">Estado del Préstamo:</label>
        <select id="estado">
            <option value="Pendiente">Pendiente</option>
            <option value="Devuelto">Devuelto</option>
        </select>
    </div>

    <button onclick="registrarPrestamo()">Registrar Préstamo</button>

    <h3>Lista de Préstamos</h3>
    <table>
        <thead>
            <tr>
                <th>Estudiante</th>
                <th>Equipo</th>
                <th>Fecha Devolución</th> <!-- Agregado -->
                <th>Estado</th>           <!-- Agregado -->
            </tr>
        </thead>
        <tbody id="tablaPrestamos">
            <!-- Los datos se insertarán aquí dinámicamente -->
        </tbody>
    </table>
</div>

<script>
    let prestamos = [];

    function registrarPrestamo() {
        const estudiante = document.getElementById('estudiante').value;
        const equipo = document.getElementById('equipo').value;
        
        // Captura de las nuevas variables de ambas ramas
        const fechaDevolucion = document.getElementById('fechaDevolucion').value;
        const estado = document.getElementById('estado').value;

        if (!estudiante || !equipo || !fechaDevolucion) {
            alert("Por favor completa todos los campos obligatorios.");
            return;
        }

        const nuevoPrestamo = {
            estudiante: estudiante,
            equipo: equipo,
            fechaDevolucion: fechaDevolucion, // Integrado
            estado: estado                     // Integrado
        };

        prestamos.push(nuevoPrestamo);
        mostrarPrestamos();
        
        // Limpiar campos
        document.getElementById('estudiante').value = '';
        document.getElementById('equipo').value = '';
        document.getElementById('fechaDevolucion').value = '';
        document.getElementById('estado').value = 'Pendiente';
    }

    function mostrarPrestamos() {
        const tbody = document.getElementById('tablaPrestamos');
        tbody.innerHTML = '';

        prestamos.forEach((p, index) => {
            // Estilo visual según el estado para darle un toque profesional
            const claseEstado = p.estado === 'Pendiente' ? 'badge-pendiente' : 'badge-devuelto';

            const fila = `<tr>
                <td>${p.estudiante}</td>
                <td>${p.equipo}</td>
                <td>${p.fechaDevolucion}</td>
                <td><span class="${claseEstado}">${p.estado}</span></td>
            </tr>`;
            tbody.innerHTML += fila;
        });
    }
</script>

</body>
</html>
